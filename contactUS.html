<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا</title>
</head>
<body>

    <h1>تواصل معنا</h1>
    <p>إذا كان لديك أي استفسار أو اقتراح، يرجى تعبئة النموذج التالي:</p>

    <form>
        <label for="name">الاسم:</label><br>
        <input type="text" id="name" name="name" placeholder="أدخل اسمك"><br><br>

        <label for="email">البريد الإلكتروني:</label><br>
        <input type="email" id="email" name="email" placeholder="example@email.com"><br><br>

        <label for="subject">الموضوع:</label><br>
        <input type="text" id="subject" name="subject" placeholder="موضوع الرسالة"><br><br>

        <label for="message">الرسالة:</label><br>
        <textarea id="message" name="message" rows="5" cols="40" placeholder="اكتب رسالتك هنا"></textarea><br><br>

        <button type="submit">إرسال</button>
        <button type="reset">إعادة تعيين</button>
    </form>

    <hr>

    <h3>معلومات التواصل</h3>
    <p>📍 العنوان: عدن، اليمن</p>
    <p>📞 الهاتف: +967 777 123 456</p>
    <p>✉️ البريد الإلكتروني: info@example.com</p>
<p></p>
</body>
</html>
